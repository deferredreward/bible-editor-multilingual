<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Translator · Translation note</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">
  <aside class="side" data-side></aside>
  <div class="stage">
    <div class="phone" id="phone">
      <div class="phone-notch"></div>
      <div class="phone-body">
        <div class="phone-bar">
          <button class="ghost-btn" type="button" onclick="location.href='t1-home.html'">← Notes</button>
          <span class="pill" id="pos">3 of 42</span>
        </div>

        <div id="view" class="fade-in"></div>

        <div class="stack" style="margin-top:8px">
          <button class="soft-btn" type="button" id="rerun">↻ Regenerar IA</button>
          <div class="row">
            <button class="danger-btn" type="button" id="skip">No hace falta</button>
            <button class="primary-btn" type="button" id="approve" style="width:auto;flex:1;border-radius:999px">Aprobar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="shell.js"></script>
<script>
  const notes = [
    {
      ref: 'Zac 1:1',
      ult: 'In the eighth month, in the second year of Darius, the word of Yahweh came to Zechariah son of Berechiah son of Iddo, the prophet, saying,',
      ust: 'In the eighth month of the second year that Darius ruled Persia, Yahweh gave this message to the prophet Zechariah son of Berechiah and grandson of Iddo:',
      quote: 'the word of Yahweh came',
      en: 'This is a common way to introduce a prophecy. It means Yahweh spoke this message to Zechariah. You may say “Yahweh spoke to Zechariah” if that is clearer in your language.',
      es: 'Esta es una forma común de presentar una profecía. Significa que Yahvé le dio este mensaje a Zacarías. Puedes decir «Yahvé habló a Zacarías» si eso es más claro en tu idioma.',
    },
    {
      ref: 'Zac 1:3',
      ult: 'Therefore say to them, “Thus says Yahweh of hosts: Return to me,” says Yahweh of hosts, “and I will return to you,” says Yahweh of hosts.',
      ust: 'So tell the people that Yahweh, the Commander of the angel armies, says this: “Return to me, and I will return to you.”',
      quote: 'Yahweh of hosts',
      en: '“Yahweh of hosts” pictures Yahweh as the commander of heaven’s armies. Keep the military sense if your language has a natural way to do so; otherwise say “Yahweh, the all-powerful God.”',
      es: '«Yahvé de los ejércitos» presenta a Yahvé como el comandante de los ejércitos del cielo. Conserva el sentido militar si tu idioma lo permite; si no, di «Yahvé, el Dios todopoderoso».',
    },
    {
      ref: 'Zac 1:8',
      ult: 'I saw in the night, and behold, a man riding on a red horse, and he was standing among the myrtle trees that were in the ravine…',
      ust: 'During the night I had a vision. I saw a man sitting on a red horse. He was standing among some myrtle trees in a small valley…',
      quote: 'myrtle trees',
      en: 'Myrtle is an evergreen shrub common in that region. If myrtle is unknown, you may say “evergreen bushes” and put the specific name in a footnote.',
      es: 'El mirto es un arbusto de hoja perenne común en esa región. Si no se conoce, puedes decir «arbustos de hoja perenne» y poner el nombre específico en una nota.',
    },
  ];

  let i = 0;
  const phone = document.getElementById('phone');
  const view = document.getElementById('view');

  const drafts = [
    'Esta es una forma habitual de abrir una profecía: Yahvé comunicó su mensaje a Zacarías. Si suena más natural, traduce: «Yahvé habló a Zacarías».',
    '«Yahvé de los ejércitos» lo muestra como comandante celestial. Mantén la imagen militar, o usa «Yahvé, el Dios todopoderoso».',
    'El mirto es un arbusto siempre verde. Si tu pueblo no lo conoce, di «arbustos siempre verdes» y explica el nombre en una nota.',
  ];

  function render() {
    const n = notes[i];
    document.getElementById('pos').textContent = (i + 1) + ' of ' + notes.length + ' (demo)';
    view.classList.remove('fade-in');
    void view.offsetWidth;
    view.classList.add('fade-in');
    view.innerHTML = `
      <div class="meta-row">
        <span class="pill teal">${n.ref}</span>
        <span class="pill amber">AI draft</span>
      </div>

      <div class="card">
        <h3>Literal · ULT</h3>
        <p class="body serif"><span class="verse-ref">${n.ref}</span>${n.ult}</p>
      </div>
      <div class="card">
        <h3>Simplified · UST</h3>
        <p class="body serif"><span class="verse-ref">${n.ref}</span>${n.ust}</p>
      </div>

      <div class="card white">
        <h3>English note · quote “${n.quote}”</h3>
        <p class="body">${n.en}</p>
      </div>

      <div class="card white" style="border-color:#b9ddd7;box-shadow:0 0 0 3px var(--accent-soft)">
        <h3>Spanish draft · editable</h3>
        <textarea class="textarea" id="draft">${n.es}</textarea>
      </div>
    `;
  }

  document.getElementById('approve').addEventListener('click', () => {
    showToast(phone, 'Approved · next note');
    i = (i + 1) % notes.length;
    setTimeout(render, 200);
  });

  document.getElementById('skip').addEventListener('click', () => {
    showToast(phone, 'Marked not needed');
    i = (i + 1) % notes.length;
    setTimeout(render, 200);
  });

  document.getElementById('rerun').addEventListener('click', () => {
    const btn = document.getElementById('rerun');
    btn.innerHTML = '<span class="spinning">↻</span> Generando…';
    btn.disabled = true;
    setTimeout(() => {
      const ta = document.getElementById('draft');
      ta.value = drafts[i];
      ta.classList.add('fade-in');
      btn.innerHTML = '↻ Regenerar IA';
      btn.disabled = false;
      showToast(phone, 'New AI draft ready');
    }, 900);
  });

  render();
</script>
</body>
</html>
